[package]
name = "cf-gears-types-registry-sdk"
version = "0.3.9"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SDK for types-registry gear: API trait, GTS entity types, and error definitions"
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
categories = ["development-tools"]
metadata.docs.rs.all-features = true

[lib]
name = "types_registry_sdk"

[lints]
workspace = true

[features]
# Default: production build, no test utilities.
default = []
# Test doubles for consumers' unit tests: `testing_platform::MockTypesRegistry`,
# an in-memory `PlatformTypesRegistryApi` + `TypesRegistryApi`, and the legacy
# `testing::MockTypesRegistryClient` for `dyn TypesRegistryClient`. Only the test
# doubles need `toolkit` (`ClientHub`) and `parking_lot`.
test-util = ["dep:toolkit", "dep:parking_lot"]

[dependencies]
# Per ADR 0005 the `TypesRegistryClient` trait boundary is `CanonicalError`;
# the SDK ships `TypesRegistryError` as an opt-in `From<CanonicalError>`
# projection (see src/error.rs). The single AIP-193 ladder
# (`From<DomainError> for CanonicalError`) lives in the impl crate's
# `api::rest::error`; this SDK depends on the canonical-errors crate to
# project that envelope into the typed view (and to construct the in-process
# `InvalidArgument` errors its client-side `try_new` constructors emit).
toolkit-canonical-errors = { workspace = true }

# Core dependencies for API trait
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5"] }
serde_json = { workspace = true }

# GTS types (from git dependency)
gts = { workspace = true }
toolkit-gts = { workspace = true }

# `PlatformTypesRegistryApi` is a `#[toolkit_contract::contract]`: the macro, its IR
# and descriptor types, and the platform-plane security context. The SDK does not
# depend on the `toolkit` runtime (its default `db`/`otel` features) outside tests.
toolkit-contract = { workspace = true }
toolkit-security = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
# Deadlines, pacing and cancellation of submit/poll and reconciliation. The
# workspace pins Tokio with `full`; `time` and `macros` are what the SDK uses.
tokio = { workspace = true, features = ["time", "macros"] }
# `PublisherVersion`: SemVer parsing and precedence.
semver = { workspace = true }
tokio-util = { workspace = true }
# Jittered backoff of reconciliation passes and transport retries.
rand = { workspace = true }

# Test doubles only (`test-util`).
toolkit = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
# Paused-clock tests of the submit/poll deadline and polling.
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
# Round-trip and consistency properties of the SDK's codecs and orderings.
proptest = { workspace = true }
# The test doubles also compile under `cfg(test)` without `test-util`.
toolkit = { workspace = true }
parking_lot = { workspace = true }
